# product_bible.yaml — v0.2 (5.1절)
# 모든 제품과 브랜드는 가상이다. facts 의 source 가 "가상 제품 설정"인 것은 예제용 설정이며,
# 내 제품으로 바꿀 때는 상세 페이지, 성분표, 시험 성적서 같은 실제 근거를 적는다.
#
# 제품 하나에 적는 것
#   appearance_en  영상과 레퍼런스 시트가 함께 쓰는 외형 서술. 눈에 보이는 것만 적는다
#   appearance_ko  사람이 읽고 확인하는 우리말 서술
#   label_text     라벨에 실제로 적힌 글자
#   facts          말해도 되는 사실과 그 출처
#   say            써도 되는 표현. 근거가 되는 사실을 단다
#   dont_say       쓰지 않는 표현과 이유. 대본에 나오면 컴파일이 막는다
version: "0.2"
products:
  moalab_aqua_serum:
    brand: MOALAB
    name_ko: 모아랩 수분 세럼
    name_en: MOALAB Aqua Serum
    appearance_en: "a 30 ml frosted glass dropper bottle with a white cap and a pale blue label reading MOALAB"
    appearance_ko: "30ml 반투명 유리 스포이트 병. 흰 뚜껑, 하늘색 라벨에 MOALAB"
    label_text: "MOALAB"
    is_own: true
    facts:
      - {id: serum_volume, text_ko: "용량 30ml", source: "가상 제품 설정"}
      - {id: serum_texture, text_ko: "묽은 젤 제형", source: "가상 제품 설정"}
      - {id: serum_fragrance, text_ko: "무향", source: "가상 제품 설정"}
      - {id: serum_usage, text_ko: "세안 후 두세 방울을 손바닥에 덜어 얼굴에 가볍게 두드린다", source: "가상 제품 설정"}
    say:
      - {text_ko: "묽은 젤 제형", evidence: [serum_texture]}
      - {text_ko: "향이 없다", evidence: [serum_fragrance]}
      - {text_ko: "세안 후 두세 방울", evidence: [serum_usage]}
    dont_say:
      - {text_ko: "24시간 촉촉", reason: "지속 시간을 잰 시험 자료가 없다"}
      - {text_ko: "민감성 피부에 안전", reason: "피부 자극 시험 자료가 없다"}
      - {text_ko: "흡수가 빠르다", reason: "흡수를 잰 자료가 없다. 제형은 말할 수 있어도 흡수는 말할 수 없다"}
  moalab_gel_sunscreen:
    brand: MOALAB
    name_ko: 모아랩 젤 선크림
    name_en: MOALAB Gel Sunscreen
    appearance_en: "a 50 ml slim white squeeze tube with a pale blue cap and a pale blue label reading MOALAB"
    appearance_ko: "50ml 가는 흰색 튜브. 하늘색 뚜껑, 하늘색 라벨에 MOALAB"
    label_text: "MOALAB"
    is_own: true
    facts:
      - {id: gel_sun_volume, text_ko: "용량 50ml", source: "가상 제품 설정"}
      - {id: gel_sun_texture, text_ko: "투명한 젤 제형", source: "가상 제품 설정"}
    say:
      - {text_ko: "투명한 젤 제형", evidence: [gel_sun_texture]}
    dont_say:
      - {text_ko: "백탁이 없다", reason: "피부색과 바르는 양에 따라 다르다. 시험 자료가 없다"}
      - {text_ko: "자외선 차단 지수", reason: "차단 지수는 이 예제의 사실에 없다. 실제 제품에서는 표시된 값과 근거를 facts 에 먼저 적는다"}
  haruon_cream_sunscreen:
    brand: HARUON
    name_ko: 하루온 크림 선크림
    name_en: HARUON Cream Sunscreen
    appearance_en: "a 50 ml short beige squeeze tube with an orange cap and an orange label reading HARUON"
    appearance_ko: "50ml 짧은 베이지색 튜브. 주황색 뚜껑, 주황색 라벨에 HARUON"
    label_text: "HARUON"
    is_own: false               # 타사 제품. 이 제품이 나오는 장면은 사람 승인을 거친다
    facts:
      - {id: cream_sun_volume, text_ko: "용량 50ml", source: "가상 제품 설정"}
      - {id: cream_sun_texture, text_ko: "흰색 크림 제형", source: "가상 제품 설정"}
    dont_say:
      - {text_ko: "답답하다", reason: "타사 제품의 사용감을 깎아내리는 표현이다"}
      - {text_ko: "끈적인다", reason: "타사 제품의 사용감을 깎아내리는 표현이다"}
