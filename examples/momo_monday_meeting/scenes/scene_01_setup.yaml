    emotion_en: "playful surprise"
  - start_s: 3
    end_s: 9
    action_ko: "모모가 화이트보드를 앞발로 톡 치며 회의를 시작한다."
    action_en: "Momo taps the whiteboard once with a paw and starts the meeting"
    camera_en: "medium shot on Momo"
    dialogue:
      speaker: momo
      text: "월요 회의 시작한다. 첫 안건, 알파 프로젝트."
