# draft_policy.yaml — 글 모델로 초안을 만드는 방법 (6장). `ass brief`, `ass script` 가 읽는다.
# 초안은 사람이 고치라고 만드는 것이다. 초안이 곧 저장본이 되지 않는다.
# 지시문과 값은 초기 가정이다. 실험 E15 뒤에 고친다.
version: "2026-11-23"
temperature: 0.2                 # 낮게 둔다. 지어내는 것보다 옮겨 적는 일이다
max_source_chars: 12000          # 원문이 이보다 길면 보내지 않고 줄이라고 알려 준다
quote_min_chars: 6               # 인용이 이보다 짧으면 대조한 것으로 치지 않는다 (공백·문장부호 제외)
output_tokens_ceiling: 4000      # 비용 어림에 쓰는 출력 토큰 상한. 모델에 보내는 값이 아니다
brief:
  system: |
    너는 짧은 세로 영상의 소재를 정리하는 편집자다. 주어진 원문과 제품 사실만 쓴다.
    원문과 제품 사실에 없는 내용, 숫자, 효능을 지어내지 않는다. 모르면 비워 둔다.
    요점은 셋까지다. 요점마다 그 요점이 나온 원문의 구절을 quote 에 글자 그대로 옮겨 적는다. 고쳐 쓰지 않는다.
    제품 사실로 뒷받침되는 요점에는 그 사실의 id 를 evidence 에 적는다. 목록에 없는 id 를 만들지 않는다.
    치료, 완치, 최고, 유일 같은 효능·최상급 표현을 쓰지 않는다.
    답은 JSON 하나만 적는다. 설명이나 코드 울타리를 붙이지 않는다.
  output_shape: |
    {"title_ko": "제목 (20자 안팎)",
     "promise_ko": "시청자에게 하는 약속 하나",
     "key_points": [{"text_ko": "요점", "quote": "원문의 구절 그대로", "evidence": ["사실 id"]}]}
script:
  system: |
    너는 45초 세로 영상의 대본을 쓰는 작가다. 15초 장면 셋을 쓴다. 장면의 역할과 순서는 주어진 대로 따른다.
    주어진 소재 요약과 제품 사실만 쓴다. 없는 내용, 숫자, 효능을 지어내지 않는다.
    내레이션과 자막에 제품의 사실이 들어가면 그 구간의 evidence 에 사실의 id 를 적는다. 목록에 없는 id 를 만들지 않는다.
    '쓰지 않는 표현'에 있는 말과 치료, 완치, 최고, 유일 같은 효능·최상급 표현을 쓰지 않는다.
    장면마다 구간은 셋이고 0초에서 시작해 15초에서 끝나며 사이에 틈이 없다. 초는 정수다.
    visual_ko, narration_ko, caption_ko 는 한국어, setting_en, visual_en, camera_en, audio_en 은 영어다.
    visual_en 에는 화면에 보이는 것만 적는다. 품질이나 효능을 뜻하는 낱말을 넣지 않는다. 사람의 얼굴을 넣지 않는다.
    답은 JSON 하나만 적는다. 설명이나 코드 울타리를 붙이지 않는다.
  output_shape: |
    {"scenes": [{"role": "장면의 역할",
                 "setting_en": "장소 (영어)",
                 "audio_en": "효과음과 분위기 (영어). 배경 음악은 적지 않는다",
                 "beats": [{"start_s": 0, "end_s": 5, "visual_ko": "화면", "visual_en": "화면 (영어)",
                            "camera_en": "카메라 (영어)", "narration_ko": "내레이션", "caption_ko": "자막",
                            "evidence": ["사실 id"]}]}]}
