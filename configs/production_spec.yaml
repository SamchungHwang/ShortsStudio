# production_spec.yaml — 제작 사양. 3장(형식과 길이 정책)과 6장(scene_spec)의 기준값.
episode:
  scene_count: 3
  scene_duration_s: 15
  total_duration_s: {min: 42, max: 48}   # 조립·트림 후 목표
  hard_max_s: 60                         # 넘기지 않는다
formats:                                 # 세 형식의 장면 뼈대 (3.2절)
  product_intro:
    name_ko: 제품 설명
    scene_roles: [problem, solution, usage]
    role_names_ko: [문제, 해결, 사용법]
    min_products: 1
    evidence_roles: [solution, usage]    # 이 장면에는 근거가 붙은 구간이 하나 이상 있어야 한다
  comparison:
    name_ko: 제품 비교
    scene_roles: [criteria, side_by_side, verdict]
    role_names_ko: [비교 기준, 나란히 보기, 누구에게 맞는가]
    min_products: 2
    evidence_roles: [side_by_side, verdict]
  info:
    name_ko: 정보 전달
    scene_roles: [question, methods, wrap_up]
    role_names_ko: [질문, 방법 세 가지, 정리]
    min_products: 0
    evidence_roles: []
    # 제품이 없는 편에는 제품 영상의 말투를 쓰지 않는다. 형식에 적으면 shot.style_en 과 exclusions_en 대신 이것을 쓴다
    style_en: "Clean realistic everyday video, soft natural daylight, shallow depth of field, calm and minimal"
    exclusions_en:
      - "No human faces"
      - "No added text overlays, captions or subtitles"
      - "No background music"
grammar:                                 # 유용한 Shorts의 문법 (3.1절). 어기면 막지 않고 알려 준다
  hook_max_s: 3                          # 첫 구간은 이 길이 안에서 끝나고 내레이션이나 자막이 있어야 한다
  narration_max_chars_per_s: 7           # 공백 제외. status: assumed — 실험 E13 에서 실제 읽는 속도로 확정
  require_closing_line: true             # 마지막 구간에 다음 행동을 말하는 내레이션이나 자막
shot:
  aspect_ratio: "9:16"
  draft_resolution: "720p"               # 초안 해상도. 360p 단가가 확인되면 8장에서 재검토
  style_en: "Clean realistic product video, soft natural daylight, shallow depth of field, calm and minimal"
narration:
  mode: tts                              # tts | in_video. status: assumed — 실험 E13 뒤에 확정
  language: ko
caption:
  max_chars: 12                          # 공백 제외. 12.2절의 8~12자 규칙
exclusions_en:                           # negative_prompt 설정값이 없으므로 프롬프트 본문에 쓴다
  - "No human faces"
  - "No added text overlays, captions or subtitles (the product label itself stays)"
  - "No background music"
prompt:
  language: en                           # 영상·음악 프롬프트는 영어
  interval_notation: true                # [0-5s] 표기. 쓸 수 있으나 정해진 문법은 아니다
