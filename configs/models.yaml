# models.yaml — 기술 스택과 확인 상태 (policy-as-data). 1.1절의 표와 `ass stack` 이 이 파일을 읽는다.
# confirmed  : 공식 문서·발표로 확인한 것 (source 에 근거를 적는다)
# unverified : 아직 확인하지 못한 것. 코드가 값으로 쓰지 않는다.
# 실험으로 확인되면 experiments/registry.yaml 의 기록 ID를 근거로 적고 confirmed 로 옮긴다.
verified_on: "2026-11-19"

video:
  name: Gemini Omni Flash 1.2
  role_ko: 영상 생성과 대화형 편집
  id: gemini-omni-1.2-flash
  api: interactions            # client.interactions.create / POST v1beta/interactions
  api_version: v1beta          # 버전을 정하지 않으면 404 Model not found 가 난다 (E00, 2026-11-19 실제 호출)
  chapters: "2, 4, 7~10"
  duration_s: {min: 3, max: 15, step: 1}
  aspect_ratios: ["9:16", "16:9"]
  resolutions:
    native: ["360p", "720p"]
    upscaled: ["1080p", "4k"]
  price_usd_per_second:
    "720p": 0.07
    "360p": null
    "1080p": null
    "4k": null
  reference_videos: {max_count: 3, max_seconds_each: 3}
  negative_prompt_param: false # 제외 지시는 프롬프트 본문에 자연어로
  confirmed:
    - "API 버전을 정하지 않은 클라이언트로 부르면 404 Model not found. v1beta 를 명시해야 한다 (E00 실제 호출, 2026-11-19)"
    - "모델 목록: v1beta 에 gemini-omni-1.1-flash, gemini-omni-1.2-flash, gemini-omni-flash-preview. v1 에는 preview 하나뿐 (E00, google-genai 3.6.1)"
    - "선불 크레딧이 0 이면 402 'Your prepayment credits are depleted' (E00). 무료 등급으로 내려가지 않는다"
    - "한 번에 최대 15초 생성 (1.1은 10초)"
    - "영상과 함께 오디오 생성, previous_interaction_id 로 대화형 편집"
    - "720p 초당 $0.07 (구글 공식 블로그의 1.2 출시 글)"
    - "해상도 360p·720p(기본), 업스케일 1080p·4k / 화면비 16:9(기본)·9:16"
    - "결과가 4MB 를 넘으면 delivery=uri 로 받아 Files API 로 내려받는다"
    - "레퍼런스 영상 최대 3개, 각 3초"
    - "모든 생성 영상에 SynthID 워터마크"
    - "negative_prompt, system instruction, temperature 없음"
    - "영어만 온전히 지원, 다른 언어는 평가되지 않음 (1.1 기준 가이드)"
    - "음성 편집과 오디오 레퍼런스 미지원, YouTube 링크 입력 불가"
    - "직접 실행(2026-11-21, google-genai 3.6.1): response_format.duration=\"15s\" 와 \"5s\" 가 받아들여진다. 15초 요청은 15.04초, 5초 요청은 5.03초, 720x1280, 24프레임, 소리 포함으로 나왔다. 15초 한 장면에 61~64초, 3.7~4.3MB. 세 장면의 실제 청구액 $3.15 (추정과 같음)"
  unverified:
    - "길이를 지정하지 않았을 때의 기본 길이. 출력이 늘 24프레임인지. 4MB 한도가 가리키는 크기 (4.3MB 파일이 기본 전달 방식으로 받아졌다)"
    - "길이를 지정하지 않았을 때의 기본 길이. 2차 자료: 10초 (E00)"
    - "결제를 설정하지 않은 무료 등급 키로 호출했을 때의 응답. 2차 자료: 쓸 수 없다"
    - "실패한 호출의 청구 여부 (E04)"
    - "720p 외 해상도의 단가, 업스케일 방식과 비용 (E06)"
    - "편집 호출의 청구액 (E04)"
    - "레퍼런스 이미지 상한 (E01), 제품 라벨 유지 (E12)"
    - "한국어 음성 품질 (E09)"
  source: "Gemini API Omni 가이드(예제는 1.1 기준), 구글 공식 블로그와 Google Cloud 블로그의 1.2 출시 글"

image:
  name: Nano Banana 2.1
  role_ko: 제품 레퍼런스 시트
  id: gemini-nano-banana-2.1
  api: interactions
  chapters: "5"
  api_version: v1beta
  max_reference_images: 14
  max_objects: 10
  max_consistent_characters: 4
  default_image_size: "1K"
  image_sizes: ["1K", "2K", "4K"]          # 대문자 K 만 받는다. 소문자는 거부된다 (공식 문서)
  price_usd_per_image: {"1K": 0.0336, "2K": 0.0504, "4K": 0.113}   # 출력 이미지 토큰 $30/1M 기준 환산
  price_usd_per_1m_input_tokens: 1.50      # 글과 레퍼런스 이미지 입력
  price_usd_per_1m_text_output_tokens: 7.50   # 글과 사고(thinking) 출력. 이미지 값에 더해진다
  verified_on: "2026-11-21"
  confirmed:
    - "레퍼런스 이미지 최대 14장"
    - "사물 10개까지 높은 충실도, 캐릭터 4명까지 일관성"
    - "Interactions API: response_format = {type: image, mime_type, aspect_ratio, image_size}, 결과는 output_image.data (base64)"
    - "image_size 는 1K, 2K, 4K. 대문자 K 만 받는다. 기본 1K"
    - "response_format.mime_type 은 image/jpeg 만 받는다. image/png 를 보내면 400 invalid_request 로 거절된다 (2026-11-23 실제 호출의 오류 응답)"
    - "가격: 입력 $1.50/1M 토큰, 이미지 출력 $30/1M 토큰 (1K $0.0336, 2K $0.0504, 4K $0.113)"
    - "생성한 이미지에는 SynthID 워터마크가 들어간다"
  unverified:
    - "레퍼런스 이미지 한 장이 입력 토큰 몇 개인지, 사고 토큰이 한 장에 얼마나 붙는지 (E07)"
    - "지원하는 화면비 전체 목록 (문서에서 9:16, 1:1, 16:9 등을 봤으나 2.1 의 전체 목록은 확인하지 못했다)"
    - "실제 호출의 결과 (2026-11-23 첫 호출은 mime_type 때문에 400 으로 거절됐다. 성공한 호출은 아직 없다. E17)"
    - "400 으로 거절된 호출이 청구되는지 (E04)"
  source: "Gemini API 이미지 생성 가이드(ai.google.dev/gemini-api/docs/nanobanana), 가격 페이지(ai.google.dev/gemini-api/docs/pricing)"

