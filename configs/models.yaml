# models.yaml — 기술 스택과 확인 상태 (policy-as-data). 1.1절의 표와 `ass stack` 이 이 파일을 읽는다.
# confirmed  : 공식 문서·발표로 확인한 것 (source 에 근거를 적는다)
# unverified : 아직 확인하지 못한 것. 코드가 값으로 쓰지 않는다.
# 실험으로 확인되면 experiments/registry.yaml 의 기록 ID를 근거로 적고 confirmed 로 옮긴다.
verified_on: "2026-11-19"

video:
  name: Gemini Omni Flash 1.2
  role_ko: 영상 생성과 대화형 편집
  id: gemini-omni-1.2-flash
  api: interactions            # client.interactions.create / POST v1beta/interactions
  api_version: v1beta          # 버전을 정하지 않으면 404 Model not found 가 난다 (E00, 2026-11-19 실제 호출)
  chapters: "2, 4, 7~10"
  duration_s: {min: 3, max: 15, step: 1}
  aspect_ratios: ["9:16", "16:9"]
  resolutions:
    native: ["360p", "720p"]
    upscaled: ["1080p", "4k"]
  price_usd_per_second:
    "720p": 0.07
    "360p": null
    "1080p": null
    "4k": null
  reference_videos: {max_count: 3, max_seconds_each: 3}
  negative_prompt_param: false # 제외 지시는 프롬프트 본문에 자연어로
  confirmed:
    - "API 버전을 정하지 않은 클라이언트로 부르면 404 Model not found. v1beta 를 명시해야 한다 (E00 실제 호출, 2026-11-19)"
    - "모델 목록: v1beta 에 gemini-omni-1.1-flash, gemini-omni-1.2-flash, gemini-omni-flash-preview. v1 에는 preview 하나뿐 (E00, google-genai 3.6.1)"
    - "선불 크레딧이 0 이면 402 'Your prepayment credits are depleted' (E00). 무료 등급으로 내려가지 않는다"
    - "한 번에 최대 15초 생성 (1.1은 10초)"
    - "영상과 함께 오디오 생성, previous_interaction_id 로 대화형 편집"
    - "720p 초당 $0.07 (구글 공식 블로그의 1.2 출시 글)"
    - "해상도 360p·720p(기본), 업스케일 1080p·4k / 화면비 16:9(기본)·9:16"
    - "결과가 4MB 를 넘으면 delivery=uri 로 받아 Files API 로 내려받는다"
    - "레퍼런스 영상 최대 3개, 각 3초"
    - "모든 생성 영상에 SynthID 워터마크"
    - "negative_prompt, system instruction, temperature 없음"
    - "영어만 온전히 지원, 다른 언어는 평가되지 않음 (1.1 기준 가이드)"
    - "음성 편집과 오디오 레퍼런스 미지원, YouTube 링크 입력 불가"
  unverified:
    - "길이를 정하는 설정값의 이름과 형식. 공식 가이드(1.1 기준)에는 없다. 2차 자료: response_format.duration=\"15s\" (E00)"
    - "길이를 지정하지 않았을 때의 기본 길이. 2차 자료: 10초 (E00)"
    - "결제를 설정하지 않은 무료 등급 키로 호출했을 때의 응답. 2차 자료: 쓸 수 없다"
    - "영상이 실제로 돌아오는 호출 (E00 3차 실행 대기: 크레딧 충전 뒤)"
    - "720p 외 해상도의 단가, 업스케일 방식과 비용 (E06)"
    - "편집 호출의 청구액 (E04)"
    - "레퍼런스 이미지 상한 (E01), 제품 라벨 유지 (E12)"
    - "한국어 음성 품질 (E09)"
  source: "Gemini API Omni 가이드(예제는 1.1 기준), 구글 공식 블로그와 Google Cloud 블로그의 1.2 출시 글"

