# retry_policy.yaml — 한도와 오류를 만났을 때 다시 시도하는 규칙 (4.4절).
# 아래 값은 초기 가정값이다. 실제로 겪은 오류를 outputs/ledger/error_log.md 에 모은 뒤 조정한다.
max_attempts: 3               # 첫 시도를 포함한 횟수. 1이면 다시 시도하지 않는다
base_delay_s: 30              # 첫 대기. 시도할 때마다 두 배가 된다 (30초, 60초)
retry_on_status: [429, 500, 503]   # 한도 초과, 서버 오류. 잠시 뒤에 다시 하면 될 수 있는 것
never_retry_status: [400, 401, 402, 403, 404]   # 요청, 키, 결제, 모델 문제. 다시 해도 같다
retry_on_timeout: false       # 응답이 끊긴 호출은 서버에서 생성이 끝나 청구됐을 수 있다. 사람이 확인한다
# 다시 시도할 때마다 추정 비용을 실행 예산에서 한 번 더 뺀다.
# 실패한 호출이 청구되는지는 확인하지 못했다 (실험 E04). 확인될 때까지 청구된다고 보고 센다.
